[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sq64-emulator"
dynamic = ["version"]
description = "Independent firmware execution and visual panel workbench for SQ-64"
requires-python = ">=3.10"
dependencies = ["unicorn==2.1.3", "capstone>=5,<6", "pyelftools>=0.31,<1"]

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5.8,<2"]

[project.scripts]
sq64-emulator = "sq64_emulator.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
sq64_emulator = ["ui/*", "ui/assets/*", "profiles/*.json"]

[tool.setuptools.packages.find]
include = ["sq64_emulator*"]
